[project]
name = "swinglab"
version = "0.1.0"
description = "미국 섹터 ETF 일봉 스윙 매매 백테스트 엔진"
readme = "README.md"
authors = [
    { name = "Taewon Park", email = "twpark@atech1221.com" }
]
requires-python = ">=3.11"
dependencies = [
    "exchange-calendars>=4.13.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "typer>=0.28.0",
    "yfinance>=1.8.0",
]

[project.scripts]
swinglab = "swinglab.cli:app"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
