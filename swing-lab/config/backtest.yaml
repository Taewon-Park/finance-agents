# 백테스트 공통 설정 (0단계는 고정값만 사용, 파라미터 최적화 없음)
initial_capital: 100000

# 편도 비용(수수료 + 슬리피지), bp 단위. 매수·매도 각각 체결금액에 적용한다.
cost_bps: 5
# 리포트에 나란히 출력할 비용 민감도 시나리오
cost_sensitivity_bps: [0, 5, 10]

# 동일 비중 1 / max_positions. 전략이 따로 정하면(바이앤홀드 = 1) 그 값을 쓴다.
max_positions: 5

# 백테스트 기간. start는 전략 워밍업이 끝난 뒤로 자동 조정된다. end가 null이면 데이터 끝까지.
start: 2010-01-01
end: null
